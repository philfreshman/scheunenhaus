version: 2

# The ecosystem here is "bun", not "npm". That distinction is the whole reason
# this file was broken before: the npm ecosystem expects package-lock.json, so
# it rewrote package.json and left bun.lock untouched. Every merged PR desynced
# the two until `bun install --frozen-lockfile` failed on main and the site
# stopped deploying. The bun ecosystem regenerates bun.lock in the same commit.
#
# No target-branch is set, so updates go to the default branch. Security updates
# always target the default branch and cannot be redirected, and pointing the
# two at different branches is what let main and development diverge.
updates:
    - package-ecosystem: "bun"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "04:00"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 10
      labels:
          - "dependencies"
          - "automated"
      rebase-strategy: auto
      ignore:
          # FullCalendar core has a 7.1.0, but daygrid, list and timegrid do not.
          # The suite only works in lockstep, so it moves by hand, together.
          - dependency-name: "@fullcalendar/*"
            update-types:
                - "version-update:semver-patch"
                - "version-update:semver-minor"
          # `astro check` needs TypeScript's programmatic API, which the native
          # 7.x compiler does not ship. A major bump here fails the build, so it
          # stays on 6.x until astro supports it: withastro/roadmap#1321.
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"
      groups:
          astro:
              patterns:
                  - "astro"
                  - "@astrojs/*"
                  - "astro-*"
          biome:
              patterns:
                  - "@biomejs/*"
          postcss:
              patterns:
                  - "postcss"
                  - "autoprefixer"
                  - "cssnano"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "04:00"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "automated"
      groups:
          github-actions:
              patterns:
                  - "*"
