name: Biome Migrate

on:
    pull_request_target:
        types:
            - opened
            - synchronize
            - reopened
            - labeled

permissions:
    contents: write

jobs:
    biome-migrate:
        # renovate.json labels the biome group "biome" and keeps it off auto-merge,
        # so the config change this pushes always gets looked at before it merges.
        if: >-
            (github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]') &&
            contains(github.event.pull_request.labels.*.name, 'biome') &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Check out PR branch
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.head.ref }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # `bun run migrate` needs the bumped Biome on disk to migrate against.
            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Run Biome migration
              run: bun run migrate

            - name: Commit updated biome.json
              run: |
                  if git diff --quiet -- biome.json; then
                    echo "No biome.json changes to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add biome.json
                  git commit -m "chore: run biome migrate"
                  git push
