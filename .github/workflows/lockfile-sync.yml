name: Sync bun lockfile

on:
    pull_request_target:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: write

jobs:
    sync:
        # Version updates go through dependabot.yml's "bun" ecosystem, which
        # writes bun.lock alongside package.json - for those this job finds
        # nothing to do and exits.
        #
        # Security updates are the gap. They are a repository setting rather
        # than config, and they are raised against the advisory's ecosystem,
        # which is npm_and_yarn - so they rewrite package.json and leave
        # bun.lock stale, exactly what made `bun install --frozen-lockfile`
        # fail on main. Those PRs land here and get their lockfile filled in.
        #
        # The commit this pushes uses GITHUB_TOKEN, which raises no events, so
        # CI does not re-run and dependabot-auto-merge.yml will not merge a
        # head that no CI run covers. Security PRs therefore finish by hand.
        if: >-
            github.actor == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Check out PR branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # --ignore-scripts: this job holds a write token and resolves versions a
            # bot picked, so no dependency lifecycle script gets to run here.
            - name: Resolve dependencies
              run: bun install --ignore-scripts

            - name: Commit updated lockfile
              run: |
                  if git diff --quiet -- bun.lock; then
                    echo "bun.lock is already in sync."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add bun.lock
                  git commit -m "chore: sync bun.lock"
                  git push
