name: CI

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Lint & build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Also the drift guard: this fails whenever package.json and bun.lock
            # disagree, which is exactly what broke the last two deploys.
            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Check formatting
              run: bun run format

            - name: Build Astro site
              run: bun run build
              env:
                  PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ secrets.PUBLIC_GOOGLE_CALENDAR_API_KEY }}
                  PUBLIC_GOOGLE_CALENDAR_ID_1: ${{ secrets.PUBLIC_GOOGLE_CALENDAR_ID_1 }}
                  PUBLIC_GOOGLE_CALENDAR_ID_2: ${{ secrets.PUBLIC_GOOGLE_CALENDAR_ID_2 }}
                  PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
                  PUBLIC_GOOGLE_MAPS_PLACE_ID: ${{ secrets.PUBLIC_GOOGLE_MAPS_PLACE_ID }}

            - name: Verify build output
              run: |
                  if [ ! -d "dist" ]; then
                    echo "❌ dist/ folder not found!"
                    exit 1
                  fi
                  echo "✅ Build output verified."
